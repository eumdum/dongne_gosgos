version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: dongne_gosgos_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: dongne_gosgos_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./front
    ports:
      - "3000:3000"
    environment:
      # ip변경시 env에서 수정!!!!!!!!!!!!!!!!!!
      - VITE_API_URL=http://${SERVER_IP}:8000
    depends_on:
      - web

volumes:
  mysql_data: