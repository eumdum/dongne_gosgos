services:
  db:
    image: mysql:8.0
    container_name: dongne_gosgos_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    environment:
      - IS_DOCKER=Ture
    container_name: dongne_gosgos_web
    restart: always
    command: gunicorn back.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  front:
    build:
      context: ./front
      args:
        # - VITE_API_URL=http://${SERVER_IP}:8000
        - VITE_API_URL=https://dongne-gosgos.store
        - VITE_KAKAO_MAP_KEY=${VITE_KAKAO_MAP_KEY}
        - VITE_IMP_KEY=${VITE_IMP_KEY}
        - VITE_CHANNEL_KEY=${VITE_CHANNEL_KEY}
    ports:
      - "3000:3000"
    expose:
      - "3000"
    depends_on:
      - web

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/home/app/web/staticfiles
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  mysql_data: